[pytest]
# The suite predates pytest: modules are named after the feature they cover rather than test_*.py,
# and the cases are unittest.TestCase classes. pytest runs them unchanged.
python_files = *.py
python_classes = Test*
python_functions = test_*
# Tiers (see developer docs, "Testing"): acceptance + api run without cloud credentials and are the
# default; cloud is opt-in via the runner scripts or "pytest integration_tests/cloud".
testpaths = acceptance api
addopts = -ra
log_cli = false
