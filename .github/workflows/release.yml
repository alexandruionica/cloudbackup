name: Release

# Manual-only release pipeline. It does NOT run the test suite (tests stay a
# local concern for now). It builds the Linux .deb/.rpm packages, a Windows
# .zip and .msi, the FreeBSD .pkg and the macOS .pkg, then publishes them all
# on a GitHub Release.
#
# Version is read from misc/version.txt and the release is tagged v<version>.
# Bump misc/version.txt and commit it before dispatching a release.
on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Mark the release as a pre-release"
        type: boolean
        default: false
      draft:
        description: "Create the release as a draft (publish manually later)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Read misc/version.txt and ensure tag is free
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < misc/version.txt)"
          if [ -z "$version" ]; then
            echo "misc/version.txt is empty" >&2
            exit 1
          fi
          tag="v${version}"
          echo "Resolved version=${version} tag=${tag}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists on origin — bump misc/version.txt before releasing." >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  linux-packages:
    name: Build Linux packages (${{ matrix.arch }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm # GitHub-hosted native ARM runner (free for public repos)
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # generate_version.sh needs git history for the commit id
      - name: Build packages
        # Each runner is native for its arch, so build-all.sh builds without
        # emulation. ARCHS pins it to this runner's arch.
        run: make packages ARCHS=${{ matrix.arch }}
      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages-${{ matrix.arch }}
          path: dist/packages/*
          if-no-files-found: error

  windows-zip:
    name: Build Windows zip (${{ matrix.arch }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm # GitHub-hosted native Windows-on-ARM runner (public repos)
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: "1" # required by github.com/mattn/go-sqlite3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # generate_version.ps1 needs git history for the commit id
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install llvm-mingw (arm64 CGO toolchain)
        # windows-latest (x64) ships a working mingw gcc; windows-11-arm does
        # not, and only the clang-based llvm-mingw can emit Windows/arm64
        # objects. Pull the latest release and point CC/CXX at its aarch64 clang.
        if: matrix.arch == 'arm64'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $rel = gh api repos/mstorsjo/llvm-mingw/releases/latest | ConvertFrom-Json
          $asset = $rel.assets | Where-Object { $_.name -match 'ucrt-aarch64\.zip$' } | Select-Object -First 1
          if (-not $asset) { $asset = $rel.assets | Where-Object { $_.name -match 'ucrt-x86_64\.zip$' } | Select-Object -First 1 }
          Write-Host "Downloading $($asset.name)"
          curl.exe -fsSL -o llvm-mingw.zip $asset.browser_download_url
          Expand-Archive -Path llvm-mingw.zip -DestinationPath C:\llvm-mingw -Force
          $bin = (Get-ChildItem -Directory C:\llvm-mingw | Select-Object -First 1).FullName + "\bin"
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          Add-Content -Path $env:GITHUB_ENV -Value "CC=aarch64-w64-mingw32-clang"
          Add-Content -Path $env:GITHUB_ENV -Value "CXX=aarch64-w64-mingw32-clang++"
      - name: Generate version stamp
        run: pwsh ./generate_version.ps1
      - name: Build cloudbackup.exe
        run: go build -v -mod=vendor -o cloudbackup.exe .
      - name: Assemble release tree
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = "dist/win/cloudbackup"
          # Create only ui/ (NOT ui/js): Copy-Item -Recurse into an existing
          # destination nests the source inside it (ui/js/js/...). Letting
          # Copy-Item create ui/js puts the files directly under ui/js.
          New-Item -ItemType Directory -Force -Path "$stage/webstatic/ui" | Out-Null
          Copy-Item cloudbackup.exe "$stage/"
          # Mirror the webstatic layout the Linux packages ship (see
          # packaging/build-in-container.sh): docs, docs_api, and a trimmed ui.
          Copy-Item -Recurse webstatic/docs "$stage/webstatic/docs"
          Copy-Item -Recurse webstatic/docs_api "$stage/webstatic/docs_api"
          Copy-Item webstatic/ui/index.html, webstatic/ui/styles.css "$stage/webstatic/ui/"
          Copy-Item -Recurse webstatic/ui/js "$stage/webstatic/ui/js"
          Copy-Item -Recurse webstatic/ui/vendor "$stage/webstatic/ui/vendor"
          # Windows-specific sample config (Windows paths + service commands).
          Copy-Item packaging/windows/config.yaml.sample "$stage/config.yaml.sample"
          Copy-Item README.md "$stage/README.md"
      - name: Create zip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ needs.version.outputs.version }}"
          $zip = "dist/cloudbackup_${version}_windows_${{ matrix.arch }}.zip"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path dist/win/cloudbackup -DestinationPath $zip -Force
          Get-ChildItem $zip
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip-${{ matrix.arch }}
          path: dist/cloudbackup_*_windows_${{ matrix.arch }}.zip
          if-no-files-found: error

  windows-msi:
    name: Build Windows installer .msi (${{ matrix.arch }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm # GitHub-hosted native Windows-on-ARM runner (public repos)
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: "1" # required by github.com/mattn/go-sqlite3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # generate_version.ps1 needs git history for the commit id
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x" # WiX v5 is a .NET tool; windows-11-arm may not ship the SDK
      - name: Install llvm-mingw (arm64 CGO toolchain)
        # See the windows-zip job: windows-11-arm has no arm64 C compiler, and
        # only clang-based llvm-mingw can emit Windows/arm64 objects for CGO.
        if: matrix.arch == 'arm64'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $rel = gh api repos/mstorsjo/llvm-mingw/releases/latest | ConvertFrom-Json
          $asset = $rel.assets | Where-Object { $_.name -match 'ucrt-aarch64\.zip$' } | Select-Object -First 1
          if (-not $asset) { $asset = $rel.assets | Where-Object { $_.name -match 'ucrt-x86_64\.zip$' } | Select-Object -First 1 }
          Write-Host "Downloading $($asset.name)"
          curl.exe -fsSL -o llvm-mingw.zip $asset.browser_download_url
          Expand-Archive -Path llvm-mingw.zip -DestinationPath C:\llvm-mingw -Force
          $bin = (Get-ChildItem -Directory C:\llvm-mingw | Select-Object -First 1).FullName + "\bin"
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          Add-Content -Path $env:GITHUB_ENV -Value "CC=aarch64-w64-mingw32-clang"
          Add-Content -Path $env:GITHUB_ENV -Value "CXX=aarch64-w64-mingw32-clang++"
      - name: Install WiX Toolset v5
        run: dotnet tool install --global wix --version 5.*
      - name: Build MSI
        run: pwsh ./packaging/windows/build-msi.ps1 -Arch ${{ matrix.arch }}
      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi-${{ matrix.arch }}
          path: dist/packages/cloudbackup_*_${{ matrix.arch }}.msi
          if-no-files-found: error

  freebsd-package:
    name: Build FreeBSD package (${{ matrix.release }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        # One package per supported FreeBSD major release: pkg stamps the
        # building host's ABI (FreeBSD:14:amd64 / FreeBSD:15:amd64) into the
        # package and refuses to install it on the other branch.
        release: ["14.5", "15.1"]
    # GitHub hosts no FreeBSD runner, and go-sqlite3 needs cgo so the binary
    # cannot be cross-compiled from Linux the way the Windows zips are. Build
    # inside a real FreeBSD VM running on the Linux runner instead.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # generate_version.sh needs git history for the commit id
      - name: Build package in FreeBSD ${{ matrix.release }}
        # Our fork of vmactions/freebsd-vm. GitHub hosts no FreeBSD runner and
        # this repo's Actions policy allows only GitHub-authored actions and our
        # own, so using the fork keeps the policy narrow instead of widening it
        # for a third party. Pinned to a commit, like the release action below,
        # because this workflow holds contents:write and a floating tag would
        # let a retag run unreviewed code with it.
        #
        # Sync with upstream deliberately, then re-pin:
        #   gh repo sync alexandruionica/freebsd-vm
        #
        # Note this does not isolate the whole supply chain: at runtime the
        # action still downloads anyvm.py and the VM images from anyvm-org.
        uses: alexandruionica/freebsd-vm@8b0f1a8fc0ea0def307835c258940ca358fe6480 # v1.5.6
        with:
          release: ${{ matrix.release }}
          usesh: true
          # ca_root_nss gives fetch(1) a CA bundle for the Go download; bash and
          # git are what generate_version.sh needs. pkg(8) itself is in base.
          prepare: |
            pkg install -y ca_root_nss bash git
          # Deliberately build-only, matching the Linux and Windows jobs: this
          # pipeline does not run the test suite (see the header comment).
          run: |
            sh packaging/freebsd/install-go.sh
            sh packaging/freebsd/build-pkg.sh
      - name: Upload FreeBSD artifact
        uses: actions/upload-artifact@v4
        with:
          name: freebsd-pkg-${{ matrix.release }}
          path: dist/packages/*.pkg
          if-no-files-found: error

  macos-package:
    name: Build macOS package (${{ matrix.arch }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26 # Apple Silicon; the default macOS runner
          - arch: amd64
            # Intel. GitHub retires x64 macOS runners in Fall 2027 when the
            # macos-15 image is removed, so this leg is on borrowed time.
            runner: macos-26-intel
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: "1" # required by github.com/mattn/go-sqlite3
      # Signing is optional: with these secrets unset every signing step below
      # is skipped and the job ships an unsigned .pkg. Populate them to turn
      # signing and notarization on without touching this workflow.
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_KEY_ISSUER: ${{ secrets.MACOS_NOTARY_KEY_ISSUER }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # generate_version.sh needs git history for the commit id
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Import Developer ID Installer certificate
        # Imports the .p12 into a throwaway keychain so productsign can find the
        # identity. Skipped entirely when MACOS_SIGN_IDENTITY is unset.
        if: env.MACOS_SIGN_IDENTITY != ''
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/build.keychain-db"
          keychain_pw="$(uuidgen)"
          security create-keychain -p "$keychain_pw" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_pw" "$keychain"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
              -P "$MACOS_CERT_PASSWORD" -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: \
              -k "$keychain_pw" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
      - name: Write App Store Connect API key for notarization
        if: env.MACOS_NOTARY_KEY_ID != ''
        env:
          MACOS_NOTARY_KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/notary_key.p8"
          printf '%s' "$MACOS_NOTARY_KEY_P8" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          echo "MACOS_NOTARY_KEY_PATH=$key_path" >> "$GITHUB_ENV"
      - name: Build package
        run: make macospackage PKG_ARCH=${{ matrix.arch }}
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-pkg-${{ matrix.arch }}
          path: dist/packages/cloudbackup_*_macos_${{ matrix.arch }}.pkg
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [version, linux-packages, windows-zip, windows-msi, freebsd-package, macos-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: List artifacts
        run: ls -lh artifacts
      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease }}
          draft: ${{ inputs.draft }}
          files: artifacts/*
          fail_on_unmatched_files: true
